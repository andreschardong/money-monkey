name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API and engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Folio.slnx
      - run: dotnet build Folio.slnx --no-restore -c Release
      # The test projects are Microsoft.Testing.Platform executables; the API tests start PostgreSQL in Docker.
      - run: dotnet run --project tests/Folio.Core.Tests --no-build -c Release
      - run: dotnet run --project tests/Folio.Api.Tests --no-build -c Release

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production
      - run: npx ng test --watch=false

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg GIT_SHA=${{ github.sha }} --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) -t money-monkey .
