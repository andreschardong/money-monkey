name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API and engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Folio.slnx
      - run: dotnet format Folio.slnx --no-restore --verify-no-changes --severity warn
      - run: dotnet build Folio.slnx --no-restore -c Release
      # Builds, runs both test suites under dotnet-coverage (the API tests start PostgreSQL in Docker) and fails
      # below 100 % lines or branches.
      - run: pwsh ./coverage.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-coverage
          path: coverage
          if-no-files-found: ignore

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run architecture
      - run: npx ng build --configuration production
      # Runs the unit tests and fails below 100 % statements, branches, functions and lines.
      - run: npm run coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: ignore

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg GIT_SHA=${{ github.sha }} --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) -t money-monkey .

  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain
