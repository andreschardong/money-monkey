<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <title>Money Monkey</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Track your portfolios across the TSX, NYSE, Nasdaq and Europe in CAD, USD and EUR."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Applies the saved theme before the first paint; a file rather than inline so the content security policy can forbid inline scripts. -->
    <script src="theme-boot.js"></script>
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#172430" />
    <!-- Installed-app details for iOS, which reads these instead of the manifest. -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Money Monkey" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The first paint, before the app's own code has run: the page colour and a quiet spinner. Angular replaces it. -->
    <style>
      html { background: #f2f4f5; }
      html[data-theme='dark'] { background: #0e1519; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; }
      .boot i { width: 36px; height: 36px; border: 3px solid rgb(27 95 156 / 20%); border-top-color: #1b5f9c; border-radius: 50%; animation: boot-spin 0.9s linear infinite; }
      html[data-theme='dark'] .boot i { border-color: rgb(106 168 224 / 20%); border-top-color: #6aa8e0; }
      @media (prefers-reduced-motion: reduce) { .boot i { animation-duration: 2.4s; } }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <app-root><div class="boot" role="status" aria-label="Loading Money Monkey"><i></i></div></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
