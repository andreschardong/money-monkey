<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <title>Money Monkey</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Track your portfolios across the TSX, NYSE, Nasdaq and Europe in CAD, USD and EUR."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Applies the saved theme before the first paint; a file rather than inline so the content security policy can forbid inline scripts. -->
    <script src="theme-boot.js"></script>
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#172430" />
    <!-- Installed-app details for iOS, which reads these instead of the manifest. -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Money Monkey" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
